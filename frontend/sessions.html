<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Viewer — AI Negotiator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #212121;
      --sidebar-bg: #171717;
      --primary-color: #2563eb;
      --text-primary: #ececec;
      --text-secondary: #8e8ea0;
      --border-color: #3f3f3f;
      --input-bg: #2f2f2f;
      --user-msg-bg: #2f2f2f;
      --success-bg: #1a3a1a;
      --success-text: #4ade80;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #sidebar-header {
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #session-count {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    #search-box {
      margin: 0.75rem 1rem;
      padding: 0.5rem 0.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.85rem;
      width: calc(100% - 2rem);
      outline: none;
    }
    #search-box::placeholder { color: var(--text-secondary); }
    #search-box:focus { border-color: var(--primary-color); }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.25rem 0;
    }

    #session-list::-webkit-scrollbar { width: 4px; }
    #session-list::-webkit-scrollbar-track { background: transparent; }
    #session-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .session-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
      transition: background 0.15s;
    }
    .session-item:hover { background: #2a2a2a; }
    .session-item.active { background: var(--input-bg); border-left: 3px solid var(--primary-color); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.deal { background: #4ade80; }
    .dot.no-deal { background: var(--text-secondary); }

    .session-info { flex: 1; min-width: 0; }
    .session-date { font-size: 0.8rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-meta { font-size: 0.73rem; color: var(--text-secondary); margin-top: 0.1rem; }

    /* ── RIGHT PANEL ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #transcript-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    #transcript-header h2 {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    #session-meta-bar {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .meta-chip {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .meta-chip span {
      color: var(--text-primary);
      font-weight: 500;
    }

    .deal-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: var(--success-bg);
      color: var(--success-text);
      font-weight: 600;
    }
    .no-deal-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: #2a2a2a;
      color: var(--text-secondary);
    }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #transcript::-webkit-scrollbar { width: 4px; }
    #transcript::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .msg {
      max-width: 75%;
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .msg.assistant {
      align-self: flex-start;
    }
    .msg.user {
      align-self: flex-end;
    }

    .msg-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .msg.user .msg-label { text-align: right; }

    .msg-bubble {
      padding: 0.7rem 1rem;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.assistant .msg-bubble {
      background: transparent;
      border: 1px solid var(--border-color);
    }
    .msg.user .msg-bubble {
      background: var(--user-msg-bg);
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      gap: 0.75rem;
    }
    #empty-state .icon { font-size: 2.5rem; }
    #empty-state p { font-size: 0.9rem; }

    #loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- LEFT PANEL -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Session Viewer</h1>
    <div id="session-count">Loading…</div>
  </div>
  <input id="search-box" type="text" placeholder="Search by session ID or date…" />
  <div id="session-list"></div>
</div>

<!-- RIGHT PANEL -->
<div id="main">
  <div id="transcript-header" style="display:none;">
    <h2 id="session-id-display"></h2>
    <div id="session-meta-bar"></div>
  </div>
  <div id="empty-state">
    <div class="icon">💬</div>
    <p>Select a session to view the transcript</p>
  </div>
  <div id="loading" style="display:none;">Loading transcript…</div>
  <div id="transcript" style="display:none;"></div>
</div>

<script src="api.js"></script>
<script>
  const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || 'http://localhost:8000';
  const api = new NegotiationAPI();

  let allSessions = [];
  let activeId = null;

  // ── FETCH SESSION LIST ──
  async function loadSessionList() {
    try {
      const res = await fetch(`${API_BASE}/api/admin/sessions`);
      const data = await res.json();
      allSessions = data.sessions;
      document.getElementById('session-count').textContent = `${allSessions.length} sessions`;
      renderList(allSessions);
    } catch (e) {
      document.getElementById('session-count').textContent = 'Failed to load';
      console.error(e);
    }
  }

  // ── RENDER LIST ──
  function renderList(sessions) {
    const container = document.getElementById('session-list');
    container.innerHTML = '';
    sessions.forEach(s => {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.session_id === activeId ? ' active' : '');
      item.dataset.id = s.session_id;

      const date = s.created_at ? formatDate(s.created_at) : '—';
      const dealText = s.deal_closed
        ? `$${Number(s.final_price).toFixed(2)} · ${s.final_delivery}d`
        : 'No deal';
      const shortId = '…' + s.session_id.slice(-8);

      item.innerHTML = `
        <div class="dot ${s.deal_closed ? 'deal' : 'no-deal'}"></div>
        <div class="session-info">
          <div class="session-date">${date}</div>
          <div class="session-meta">${shortId} &nbsp;·&nbsp; ${dealText}</div>
        </div>
      `;
      item.addEventListener('click', () => selectSession(s.session_id));
      container.appendChild(item);
    });
  }

  // ── SELECT SESSION ──
  async function selectSession(id) {
    if (activeId === id) return;
    activeId = id;

    // Update active state in list
    document.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });

    // Show loading
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('transcript').style.display = 'none';
    document.getElementById('transcript-header').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';

    try {
      const data = await api.getSession(id);
      renderTranscript(data);
    } catch (e) {
      console.error(e);
      document.getElementById('loading').textContent = 'Error loading session.';
    }
  }

  // ── RENDER TRANSCRIPT ──
  function renderTranscript(data) {
    document.getElementById('loading').style.display = 'none';

    // Header
    const header = document.getElementById('transcript-header');
    header.style.display = 'block';
    document.getElementById('session-id-display').textContent = data.session_id;

    const agreed = data.agreed_terms || {};
    const hasDeal = agreed.price != null;
    const metaBar = document.getElementById('session-meta-bar');
    metaBar.innerHTML = `
      <div class="meta-chip">Created: <span>${formatDate(data.created_at)}</span></div>
      <div class="meta-chip">Opening: <span>$${data.deal_params?.price?.opening ?? '—'}</span></div>
      <div class="meta-chip">Reservation: <span>$${data.deal_params?.price?.reservation ?? '—'}</span></div>
      ${hasDeal
        ? `<span class="deal-badge">Deal: $${Number(agreed.price).toFixed(2)} / ${agreed.delivery}d / turn ${agreed.turn}</span>`
        : `<span class="no-deal-badge">No deal reached</span>`}
    `;

    // Messages
    const container = document.getElementById('transcript');
    container.innerHTML = '';
    const history = data.history || [];
    history.forEach(msg => {
      const div = document.createElement('div');
      div.className = `msg ${msg.role}`;
      const label = msg.role === 'assistant' ? 'Alex (Seller)' : 'Student (Buyer)';
      div.innerHTML = `
        <div class="msg-label">${escapeHtml(label)}</div>
        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      `;
      container.appendChild(div);
    });

    container.style.display = 'flex';
    container.scrollTop = 0;
  }

  // ── SEARCH ──
  document.getElementById('search-box').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = allSessions.filter(s =>
      s.session_id.toLowerCase().includes(q) ||
      (s.created_at && s.created_at.toLowerCase().includes(q))
    );
    renderList(filtered);
  });

  // ── HELPERS ──
  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── INIT ──
  loadSessionList();
</script>
</body>
</html>
